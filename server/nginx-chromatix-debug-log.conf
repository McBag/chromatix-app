# Add inside the autodownloader.dagger.usbx.me server { } block,
# before `location /`. Exact-match so the SPA fallback cannot serve index.html.
# Copy server/chromatix-debug-log.php to ~/scripts/chromatix-debug-log.php first.
# Log file: ~/logs/chromatix-debug.log (outside www, not publicly downloadable).
#
# Test:  nginx -t -p $HOME/.apps/nginx/ -c nginx.conf
# Reload: app-nginx restart
# Backup: cp ~/.apps/nginx/sites-available/default ~/.apps/nginx/sites-available/default.bak-YYYY-MM-DD-logging

# Chromatix debug log (POST only; PHP appends to ~/logs/chromatix-debug.log)
location = /__chromatix-debug-log {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    access_log off;
    add_header Cache-Control "no-store" always;
    include conf/fastcgi_params;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param SCRIPT_FILENAME /home/autodownloader/scripts/chromatix-debug-log.php;
    fastcgi_param DOCUMENT_ROOT /home/autodownloader/scripts;
    fastcgi_pass unix:/etc/seedbox/user/autodownloader/var/php7.0-fpm.sock;
}
