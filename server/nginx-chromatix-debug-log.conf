# Add inside the self-hosted site's server { } block,
# before `location /`. Exact-match so the SPA fallback cannot serve index.html.
# Copy server/chromatix-debug-log.php to ~/scripts/chromatix-debug-log.php first.
# Log file: ~/logs/chromatix-debug.log (outside www, not publicly downloadable).
#
# Replace the SCRIPT_FILENAME, DOCUMENT_ROOT, and fastcgi_pass placeholders
# with this host's home directory and PHP-FPM socket. Test and reload with
# the host's usual nginx workflow, after backing up the site config.

# Chromatix debug log (POST only; PHP appends to ~/logs/chromatix-debug.log)
location = /__chromatix-debug-log {
    limit_except POST { deny all; }
    client_max_body_size 32k;
    client_body_buffer_size 32k;
    access_log off;
    add_header Cache-Control "no-store" always;
    include conf/fastcgi_params;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param SCRIPT_FILENAME /path/to/home/scripts/chromatix-debug-log.php;
    fastcgi_param DOCUMENT_ROOT /path/to/home/scripts;
    fastcgi_pass unix:/path/to/php-fpm.sock;
}
