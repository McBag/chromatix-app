<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <!-- TITLE -->
  <title>Chromatix</title>

  <!-- VIEWPORT -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">

  <!-- FAVICONS (relative for Tesla static hosting) -->
  <link rel="icon" href="./icon/favicon.ico" sizes="any">
  <link rel="icon" href="./icon/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon/icon-180.png">

  <!-- META DESCRIPTION -->
  <meta name="description" content="Chromatix is a desktop music player for Plex and Jellyfin that transforms your listening experience and makes interacting with your music libraries a joy.">

  <!-- SHARING -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Chromatix">
  <meta property="og:url" content="https://chromatix.app/">
  <meta property="og:title" content="Chromatix">
  <meta property="og:description" content="Chromatix is a desktop music player for Plex and Jellyfin that transforms your listening experience and makes interacting with your music libraries a joy.">
  <meta property="og:image" content="https://chromatix.app/images/compressed/chromatix006.jpg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1425">
  <meta property="og:image:alt" content="Chromatix music player for Plex and Jellyfin">
  <meta name="twitter:card" content="summary_large_image">

  <!-- MANIFEST intentionally omitted for Tesla static hosting -->

  <!-- INITIAL CSS -->
  <style id="style-initial">
    html,
    body{
      background:#fff;
      color:#111;
    }
    @media (prefers-color-scheme: dark) {
      html,
      body{
        background:#111;
        color:#fff;
      }
    }
    .app-boot-loader{
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      text-align:center;
    }
    .app-boot-loader:after{
      width:32px;
      height:32px;
      border:3px solid currentColor;
      border-top-color:transparent;
      border-radius:50%;
      animation:chromatix-boot-spin 1s linear infinite;
      content:"";
    }
    @keyframes chromatix-boot-spin {
      to{
        transform:rotate(360deg);
      }
    }
  </style>

</head>
<body>

  <div id="app-boot-loader" class="app-boot-loader" aria-live="polite"></div>
  <div id="root"></div>

  <script type="module" src="/src/index.tsx"></script>

</body>
</html>
